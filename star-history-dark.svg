<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.30"/><stop offset="55%" stop-color="#38bdf8" stop-opacity="0.10"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01"/></linearGradient>
<radialGradient id="marker-halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
